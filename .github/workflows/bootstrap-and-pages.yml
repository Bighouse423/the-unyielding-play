name: Bootstrap and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack bootstrap snapshot if needed
        run: |
          set -euo pipefail
          if [ -f index.html ] && [ -d audio ] && [ -f assets.js ]; then
            echo "Site files already present"
            exit 0
          fi
          test -f bootstrap/MANIFEST.json
          python3 << 'PY'
          import json, base64, hashlib, pathlib, sys
          man = json.loads(pathlib.Path("bootstrap/MANIFEST.json").read_text())
          b64 = "".join((pathlib.Path("bootstrap") / p).read_text() for p in man["parts"])
          data = base64.b64decode(b64)
          digest = hashlib.sha256(data).hexdigest()
          if digest != man["sha256"]:
              sys.exit(f"sha256 mismatch: {digest} != {man['sha256']}")
          pathlib.Path("/tmp/site.zip").write_bytes(data)
          print("decoded", len(data), "bytes ok")
          PY
          mkdir -p /tmp/site
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/site.zip').extractall('/tmp/site')"
          rsync -a --exclude '.git' --exclude '.github' --exclude 'bootstrap' /tmp/site/ ./
          rm -rf bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unpack frozen m7d public playtest and remove bootstrap chunks [skip ci]"
            git push
          fi

      - name: Enable GitHub Pages (Actions source)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          curl -sS -o /tmp/pages-post.json -w "POST %{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}'
          curl -sS -o /tmp/pages-put.json -w "PUT %{http_code}\n" \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}'
          echo "----- POST -----"; cat /tmp/pages-post.json; echo
          echo "----- PUT -----"; cat /tmp/pages-put.json; echo

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site artifact
        run: |
          mkdir -p /tmp/gh-pages-site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'bootstrap' ./ /tmp/gh-pages-site/
          test -f /tmp/gh-pages-site/index.html
          ls -la /tmp/gh-pages-site | head

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/gh-pages-site

      - id: deployment
        uses: actions/deploy-pages@v4
